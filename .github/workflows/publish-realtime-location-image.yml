name: Publish Realtime Sideband Fix Image

on:
  workflow_dispatch:
  push:
    branches:
      - realtime_location_header
      - realtime-direct-ws-router-fix
    paths:
      - .github/workflows/publish-realtime-location-image.yml
      - Dockerfile
      - docker/**
      - litellm/**
      - litellm-proxy-extras/**
      - pyproject.toml
      - schema.prisma
      - tests/test_litellm/proxy/realtime_endpoints/**
      - tests/test_litellm/llms/openai/realtime/**
      - tests/test_litellm/realtime_api/**
      - tests/realtime_proxy_smoke/**
      - ui/**
      - uv.lock

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Realtime regression test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Install dependencies
        run: >-
          .github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev
          --extra google --extra proxy --extra semantic-router --extra saml

      - name: Generate Prisma client
        run: uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

      - name: Run Realtime WebRTC endpoint tests
        run: >-
          uv run --no-sync pytest
          tests/test_litellm/proxy/realtime_endpoints/
          tests/test_litellm/realtime_api/test_main.py
          tests/test_litellm/llms/openai/realtime/test_openai_realtime_handler.py
          tests/test_litellm/litellm_core_utils/test_realtime_streaming.py
          tests/test_litellm/test_router.py::test_get_deployment_credentials_with_provider_resolves_credential_name
          -q

  publish:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/c0mmander198/litellm
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE}:realtime-sideband-fix" \
            --tag "${IMAGE}:realtime-sideband-fix-${GITHUB_SHA::12}" \
            .

      - name: Smoke-test built image through direct Realtime WebSocket
        run: bash tests/realtime_proxy_smoke/run.sh "${IMAGE}:realtime-sideband-fix-${GITHUB_SHA::12}"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Publish image
        run: |
          docker push "${IMAGE}:realtime-sideband-fix"
          docker push "${IMAGE}:realtime-sideband-fix-${GITHUB_SHA::12}"
